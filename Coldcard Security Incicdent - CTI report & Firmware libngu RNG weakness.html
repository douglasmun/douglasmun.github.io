 var(--space-2);break-before:page\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">4<\u002Fspan>Anatomy of the failure, one seam at a time<\u002Fh3>\n<p style=\"text-align:justify;hyphens:auto\">We now walk the call chain. At each step there is a code exhibit and a <strong>bug class<\u002Fstrong> — the generalizable name for the mistake, so you can recognize its cousins in your own code.<\u002Fp>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">4.1 &nbsp;The guard that checked the wrong thing — <em>presence vs. value<\u002Fem><\u002Fh4>\n<p><code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> wires its entropy function and tries to protect itself with a compile-time assertion:<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">extern uint32_t rng_get(void);\n#define CHIP_TRNG_32() rng_get()\n\n#ifndef MICROPY_HW_ENABLE_RNG\n#error \"get a HW TRNG plz\"\n#endif<\u002Fpre>\n<figcaption><strong>Exhibit C<\u002Fstrong> — <code style=\"font-family:ui-monospace,Menlo,monospace\">libngu<\u002Fcode>'s entropy selection and its \"safety\" guard.<\u002Ffigcaption>\n<\u002Ffigure>\n<p style=\"text-align:justify;hyphens:auto\">The intent of that <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#error<\u002Fcode> is beautiful: <em>\"refuse to build unless a hardware TRNG is configured.\"<\u002Fem> It is a fail-safe. But <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#ifndef<\u002Fcode> asks <strong>\"is this symbol defined?\"<\u002Fstrong> — not <strong>\"is it enabled?\"<\u002Fstrong> The macro <em>is<\u002Fem> defined. Its value is <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">0<\u002Fcode>. So the guard is satisfied and the build proceeds in silence.<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-accent-100);border:1px solid var(--color-accent-300);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">#if !MICROPY_HW_ENABLE_RNG\n#error \"get a HW TRNG plz\"\n#endif<\u002Fpre>\n<figcaption><strong>Illustrative<\u002Fstrong> — the one-character fix.<\u002Ffigcaption>\n<\u002Ffigure>\n<div class=\"card\" style=\"break-inside:avoid;margin-bottom:var(--space-4)\"><div class=\"card-kicker\">Bug class<\u002Fdiv><div class=\"card-title\">Presence-check masquerading as value-check<\u002Fdiv><p class=\"card-body\" style=\"text-align:justify;hyphens:auto\"><code style=\"font-family:ui-monospace,Menlo,monospace\">#ifdef<\u002Fcode>/<code style=\"font-family:ui-monospace,Menlo,monospace\">#ifndef<\u002Fcode> test <em>existence<\u002Fem>; <code style=\"font-family:ui-monospace,Menlo,monospace\">#if<\u002Fcode> tests <em>truth<\u002Fem>. A macro defined as <code style=\"font-family:ui-monospace,Menlo,monospace\">0<\u002Fcode> is simultaneously \"defined\" and \"false.\" Any guard whose <em>meaning<\u002Fem> is \"this feature is ON\" must use <code style=\"font-family:ui-monospace,Menlo,monospace\">#if<\u002Fcode>, never <code style=\"font-family:ui-monospace,Menlo,monospace\">#ifdef<\u002Fcode>. This same trap exists in shell (<code style=\"font-family:ui-monospace,Menlo,monospace\">[ -n \"$VAR\" ]<\u002Fcode> vs <code style=\"font-family:ui-monospace,Menlo,monospace\">[ \"$VAR\" = \"1\" ]<\u002Fcode>), in feature flags (<code style=\"font-family:ui-monospace,Menlo,monospace\">if 'flag' in config<\u002Fcode> vs <code style=\"font-family:ui-monospace,Menlo,monospace\">if config['flag'] is True<\u002Fcode>), and in env vars (<code style=\"font-family:ui-monospace,Menlo,monospace\">FEATURE=0<\u002Fcode> is still a non-empty string).<\u002Fp><\u002Fdiv>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">4.2 &nbsp;The symbol that resolved to the wrong implementation — <em>implicit linkage<\u002Fem><\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">Even past the guard, <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> calls <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">rng_get()<\u002Fcode>. Who provides <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">rng_get()<\u002Fcode>? Not Coldcard's board layer — that exports <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">random32()<\u002Fcode> and <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">random_buffer()<\u002Fcode>, under <em>different names<\u002Fem>. There is no board-provided <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">rng_get()<\u002Fcode> symbol. So at link time, <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">rng_get()<\u002Fcode> resolves to <strong>MicroPython's<\u002Fstrong> <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">rng_get()<\u002Fcode> instead.<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">#if MICROPY_HW_ENABLE_RNG\n    // STM32 hardware RNG\n#else\n    // Yasmarang software fallback\n#endif<\u002Fpre>\n<figcaption><strong>Exhibit D<\u002Fstrong> — MicroPython selects hardware vs software by the macro's VALUE.<\u002Ffigcaption>\n<\u002Ffigure>\n<p style=\"text-align:justify;hyphens:auto\">Note the cruel symmetry: MicroPython uses <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#if<\u002Fcode> (correct — it reads the <em>value<\u002Fem> <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">0<\u002Fcode> and picks the software branch), while <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> used <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#ifndef<\u002Fcode> (incorrect — it read only <em>existence<\u002Fem> and thought hardware was present). The two files disagreed about what <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">MICROPY_HW_ENABLE_RNG = 0<\u002Fcode> meant, and the linker silently picked a winner.<\u002Fp>\n<div class=\"card\" style=\"break-inside:avoid;margin-bottom:var(--space-4)\"><div class=\"card-kicker\">Bug class<\u002Fdiv><div class=\"card-title\">Implicit linkage / name-based coupling<\u002Fdiv><p class=\"card-body\" style=\"text-align:justify;hyphens:auto\">A function was selected by <em>name collision across modules<\u002Fem>, not by an explicit, typed dependency. Nothing forced \"the entropy source <code style=\"font-family:ui-monospace,Menlo,monospace\">libngu<\u002Fcode> uses\" to be \"the entropy source the board vouches for.\" <strong>Security-critical dependencies should be injected explicitly and verified at a single, obvious point<\u002Fstrong> — passed in, asserted, and logged — not resolved by whichever translation unit happens to export a matching symbol.<\u002Fp><\u002Fdiv>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">4.3 &nbsp;The fallback seeded from non-secrets — <em>non-entropy dressed as entropy<\u002Fem><\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">Because the software branch was selected, <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">rng_get()<\u002Fcode> initialized the Yasmarang PRNG <strong>once<\u002Fstrong>, from device metadata and timers:<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">pad = UID_low32 ^ SysTick-&gt;VAL;   // chip's low UID word XOR a millisecond down-counter\nn   = RTC-&gt;TR;                    // real-time-clock time register\nd   = RTC-&gt;SSR;                   // RTC sub-second counter\ndat = 0;<\u002Fpre>\n<figcaption><strong>Exhibit E<\u002Fstrong> — MicroPython Yasmarang initialization (once, on first call).<\u002Ffigcaption>\n<\u002Ffigure>\n<p>Every input here is <strong>fixed, timing-derived, or correlated<\u002Fstrong> — none is sampled randomness:<\u002Fp>\n<ul style=\"padding-left:1.2em;line-height:1.65\">\n<li style=\"margin-bottom:var(--space-1)\"><strong>UID<\u002Fstrong> is a factory-set chip identifier. It is <em>not a secret<\u002Fem>; it is even partly exposed in the device's USB serial number. Only its low 32-bit word participates.<\u002Fli>\n<li style=\"margin-bottom:var(--space-1)\"><strong>SysTick<\u002Fstrong> is a predictable down-counter with a small range (tens of thousands of values).<\u002Fli>\n<li><strong>RTC-&gt;TR / RTC-&gt;SSR<\u002Fstrong> are correlated with SysTick and each other; on Mk2/Mk3 cold boot the RTC oscillator is disabled, so these are likely static.<\u002Fli>\n<\u002Ful>\n<p style=\"text-align:justify;hyphens:auto\">After initialization, <strong>no fresh entropy is ever collected again<\u002Fstrong> — every output is a deterministic step from that state.<\u002Fp>\n<div class=\"card\" style=\"break-inside:avoid;margin-bottom:var(--space-4)\"><div class=\"card-kicker\">Bug class<\u002Fdiv><div class=\"card-title\">Category error — identifiers and timers treated as entropy<\u002Fdiv><p class=\"card-body\" style=\"text-align:justify;hyphens:auto\">A globally <em>unique<\u002Fem> value (like a UID) is not a <em>secret<\u002Fem> or <em>uniformly random<\u002Fem> value. Uniqueness ≠ unpredictability. A counter that \"changes between boots\" is not an entropy source if its range is small and observable. <strong>Write down, per input, the number of bits an attacker cannot predict — then sum honestly.<\u002Fstrong> Here that sum is far below the 128 bits a seed needs.<\u002Fp><\u002Fdiv>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">4.4 &nbsp;The XOR that faked diversification — <em>combining two knowns<\u002Fem><\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\"><code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> then XORs MicroPython's output with a <em>second<\u002Fem> Yasmarang generator of its own. Surely two generators are better than one?<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">static uint32_t yasmarang_pad = 0x0a8ce26f;\nstatic uint32_t yasmarang_n   = 69;\nstatic uint32_t yasmarang_d   = 233;\nstatic uint8_t  yasmarang_dat = 0;\n\n// per output word:\nchip  = rng_get();        // MicroPython fallback (deterministic, as above)\nchip ^= my_yasmarang();   // libngu Yasmarang (seeded from the constants above)<\u002Fpre>\n<figcaption><strong>Exhibit F<\u002Fstrong> — <code style=\"font-family:ui-monospace,Menlo,monospace\">libngu<\u002Fcode>'s second Yasmarang, seeded from hard-coded constants.<\u002Ffigcaption>\n<\u002Ffigure>\n<p style=\"text-align:justify;hyphens:auto\">Those constants are <strong>identical on every device on Earth<\u002Fstrong>. A generator seeded from public constants contributes <strong>zero<\u002Fstrong> entropy. And XOR does not manufacture randomness: the XOR of two <em>reproducible<\u002Fem> streams is itself <em>reproducible<\u002Fem>.<\u002Fp>\n<div class=\"card\" style=\"break-inside:avoid;margin-bottom:var(--space-4)\"><div class=\"card-kicker\">Bug class<\u002Fdiv><div class=\"card-title\">Security theater via combination<\u002Fdiv><p class=\"card-body\" style=\"text-align:justify;hyphens:auto\">Mixing sources only helps if at least one source is <em>independently unpredictable<\u002Fem>. <code style=\"font-family:ui-monospace,Menlo,monospace\">known ⊕ known = known<\u002Fcode>. This is the same fallacy as \"we hash the password twice\" or \"we double-encrypt with the same key.\" <strong>Combining functions concentrate assurance; they cannot create it.<\u002Fstrong><\u002Fp><\u002Fdiv>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">4.5 &nbsp;The reseed that threw away 28 of 32 bytes — <em>silent truncation<\u002Fem><\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">Later devices (Mk4/Q/Mk5) added a secure-element reseed to help. It reads 40 bytes of good material — and then keeps four.<\u002Fp>\n<figure style=\"margin:0 0 var(--space-3);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">a = callgate.read_rng(1)              # 32 bytes from secure element SE1 (good!)\nb = callgate.read_rng(2)              # 8 bytes from SE2\nn = ngu.hash.sha256d(a + b)           # 32-byte digest of 40 good bytes\nn, = ustruct.unpack('I', n[0:4])      # &lt;-- keep only 4 bytes (32 bits)\nngu.random.reseed(n)<\u002Fpre>\n<figcaption><strong>Exhibit G<\u002Fstrong> — Mk4 boot reseed.<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">STATIC mp_obj_t random_reseed(mp_obj_t arg) {\n    yasmarang_pad = mp_obj_get_int_truncated(arg);   // one word; the rest of the state is untouched\n    return mp_const_none;\n}<\u002Fpre>\n<figcaption><strong>Exhibit H<\u002Fstrong> — and <code style=\"font-family:ui-monospace,Menlo,monospace\">reseed()<\u002Fcode> overwrites exactly one 32-bit state word.<\u002Ffigcaption>\n<\u002Ffigure>\n<p style=\"text-align:justify;hyphens:auto\">So no matter how excellent SE1's 32 bytes were, the reseed API accepts a single machine-word. It does not seed a DRBG, does not reseed MicroPython's fallback, does not reset the other state words, and provides no ongoing reseeding. The result: <strong>at most 2³² distinguishable output streams<\u002Fstrong> on current devices.<\u002Fp>\n<div class=\"card\" style=\"break-inside:avoid;margin-bottom:var(--space-4)\"><div class=\"card-kicker\">Bug class<\u002Fdiv><div class=\"card-title\">Silent narrowing / lossy interface<\u002Fdiv><p class=\"card-body\" style=\"text-align:justify;hyphens:auto\"><code style=\"font-family:ui-monospace,Menlo,monospace\">n[0:4]<\u002Fcode> and <code style=\"font-family:ui-monospace,Menlo,monospace\">mp_obj_get_int_truncated()<\u002Fcode> each quietly discard bits with no error. A crypto reseed API that takes an <code style=\"font-family:ui-monospace,Menlo,monospace\">int<\u002Fcode> argument is a design smell — it invites truncation. <strong>Entropy-bearing interfaces should take a byte buffer and a length, reject short inputs, and make truncation loud, not implicit.<\u002Fstrong> This is also why Coinkite's <em>estimate<\u002Fem> of ~72 bits and Block's <em>bound<\u002Fem> of ≤2³² diverge — a genuinely disputed point.<\u002Fp><\u002Fdiv>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">4.6 &nbsp;The health checks that a broken RNG passes — <em>tests that only catch nothing<\u002Fem><\u002Fh4>\n<p>Two \"sanity checks\" existed. Neither could see this failure.<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">seed = ngu.random.bytes(32)\nassert len(set(seed)) &gt; 4          # \"more than 4 distinct byte values\" — trivially true\nreturn ngu.hash.sha256d(seed)<\u002Fpre>\n<figcaption><strong>Exhibit I<\u002Fstrong> — the wallet-generation \"check\".<\u002Ffigcaption>\n<\u002Ffigure>\n<p style=\"text-align:justify;hyphens:auto\">A deterministic PRNG easily produces 32 varied-looking bytes, so <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">len(set(seed)) &gt; 4<\u002Fcode> always passes. The other check — rejecting <em>adjacent repeated words<\u002Fem> — is likewise passed by any non-degenerate PRNG. Both checks answer \"does the output look non-constant?\" Neither answers the only question that mattered: <strong>\"is this output unpredictable?\"<\u002Fstrong><\u002Fp>\n<div class=\"card\" style=\"break-inside:avoid;margin-bottom:var(--space-4)\"><div class=\"card-kicker\">Bug class<\u002Fdiv><div class=\"card-title\">Liveness check mistaken for a security check<\u002Fdiv><p class=\"card-body\" style=\"text-align:justify;hyphens:auto\">Statistical \"looks random\" tests (distinct bytes, no repeats, even a chi-squared) detect <em>stuck<\u002Fem> generators, not <em>predictable<\u002Fem> ones. A counter encrypted under a fixed key passes every statistical test and has zero security. <strong>You cannot unit-test unpredictability from the output alone; you must verify the source.<\u002Fstrong><\u002Fp><\u002Fdiv>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">4.7 &nbsp;Why hashing at the end could not save it — <em>garbage-in is preserved<\u002Fem><\u002Fh4>\n<p>The final SHA-256d (and the BIP-39 checksum) cannot rescue a small input space:<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">   ≤ 2^32 possible RNG outputs\n        │  SHA256d  (deterministic)\n        ▼\n   ≤ 2^32 possible seeds        # hashing maps a small set to a small set<\u002Fpre>\n<figcaption>Whitening moves the values; it does not add any.<\u002Ffigcaption>\n<\u002Ffigure>\n<div class=\"card\" style=\"break-inside:avoid;margin-bottom:var(--space-4)\"><div class=\"card-kicker\">Bug class<\u002Fdiv><div class=\"card-title\">Expecting a hash to add entropy<\u002Fdiv><p class=\"card-body\" style=\"text-align:justify;hyphens:auto\">A deterministic function cannot increase the cardinality of its input set. Hashing <em>whitens<\u002Fem> (makes output look uniform) but never <em>widens<\u002Fem>. If there are 2³² possible inputs, there are ≤ 2³² possible outputs — and the public blockchain lets an attacker test each candidate. <strong>Whitening ≠ entropy.<\u002Fstrong><\u002Fp><\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">5<\u002Fspan>The meta-failure: how five years of review missed it<\u002Fh3>\n<p style=\"text-align:justify;hyphens:auto\">Every individual bug above is small. The reason they survived is the more important lesson, and it is organizational, not syntactic.<\u002Fp>\n<ul style=\"padding-left:1.2em;line-height:1.65\">\n<li style=\"margin-bottom:var(--space-2)\"><strong>The correct code was present.<\u002Fstrong> The real STM32 TRNG wrapper existed in the binary and was even used — for less-critical things. Reviewers saw TRNG code and reasonably assumed the seed path reached it. <em>The code you can point to is not necessarily the code that runs.<\u002Fem><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>The regression rode in on a good change.<\u002Fstrong> The defect entered during the migration to <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libsecp256k1<\u002Fcode> — a security <em>improvement<\u002Fem>. Refactors that touch crypto plumbing are exactly where reviewers relax (\"we're just moving to a better library\") and exactly where wiring silently changes.<\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Nothing failed loudly.<\u002Fstrong> No exception, no failed build, no red test. Fail-open defects are invisible precisely because everything appears to work.<\u002Fli>\n<li><strong>\"Open source\" did not mean \"audited.\"<\u002Fstrong> The vulnerable path sat in public source for five years. Many eyes read the repository; few traced <em>which<\u002Fem> <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">rng_get()<\u002Fcode> the <em>seed<\u002Fem> path actually bound to at link time.<\u002Fli>\n<\u002Ful>\n<div style=\"border-left:2px solid var(--color-accent);padding:var(--space-2) 0 var(--space-2) var(--space-4);margin:var(--space-4) 0;font-size:14px;text-align:justify;hyphens:auto;break-inside:avoid\">Coinkite also <strong>speculated<\u002Fstrong> the attacker may have used AI-assisted review to find the latent bug quickly — a plausible but <strong>unproven<\u002Fstrong> claim. The defensible general lesson stands regardless: <em>if your code is or ever was public, assume adversaries are reading it with tireless automated tools. Latent bugs have a shorter shelf life now.<\u002Fem><\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2);break-before:page\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">6<\u002Fspan>Lessons, generalized<\u002Fh3>\n<p style=\"font-size:13px;font-style:italic;color:var(--color-neutral-700)\">Each lesson is stated as a principle, tied back to the exhibit, with the fix.<\u002Fp>\n<ol style=\"padding-left:0;list-style:none;margin:0;counter-reset:lesson\">\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">1<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Guards must fail closed, and must test values, not existence.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(Exhibit C.)<\u002Fspan> Use <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#if<\u002Fcode>, not <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#ifdef<\u002Fcode>/<code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#ifndef<\u002Fcode>, when the meaning is \"feature enabled.\" A safety assertion that can pass while the thing it guards is disabled is worse than none, because it manufactures false confidence.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">2<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Inject security-critical dependencies explicitly; verify at one obvious point.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(Exhibit D.)<\u002Fspan> Never let \"which RNG do we use\" be decided by a link-time name collision. Pass the entropy source in, assert its identity, and refuse to proceed otherwise.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">3<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Uniqueness is not secrecy; a counter is not entropy.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(Exhibit E.)<\u002Fspan> For every input to a security decision, write the attacker-unpredictable bit count next to it. Reject the design if the honest sum is short.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">4<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Combining known values cannot create randomness.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(Exhibit F.)<\u002Fspan> <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">known ⊕ known = known<\u002Fcode>. Diversification only helps when a source is independently unpredictable.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">5<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Entropy interfaces should carry bytes and lengths, and make truncation loud.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(Exhibits G–H.)<\u002Fspan> An RNG reseed that accepts an <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">int<\u002Fcode> is a truncation waiting to happen. Prefer <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">reseed(const uint8_t *buf, size_t len)<\u002Fcode> that rejects short inputs.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">6<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Test the source of randomness, not the shape of the output.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(Exhibit I.)<\u002Fspan> \"Looks random\" tests catch stuck generators, never predictable ones.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">7<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Whitening is not widening.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(§4.7.)<\u002Fspan> A final hash cannot repair a small input space.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">8<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Test the artifact, not the intention.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(§5.)<\u002Fspan> Verify what the <em>shipping binary's production path<\u002Fem> actually calls — not what the codebase contains in principle.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">9<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Refactors that touch crypto plumbing get <em>more<\u002Fem> review, not less.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\"><span style=\"color:var(--color-neutral-600)\">(§5.)<\u002Fspan> The \"we're just adopting a better library\" migration is the highest-risk moment.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:var(--space-3) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:28px;font-weight:400;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">10<\u002Fdiv><div><div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:2px\">Defense in depth survives a broken layer.<\u002Fdiv><p style=\"margin:0;font-size:14px;text-align:justify;hyphens:auto\">User-supplied dice entropy, a strong unique BIP-39 passphrase, and multi-vendor multisig each remained safe <em>because they add an independent secret the broken RNG never touched.<\u002Fem> When one layer failed catastrophically, users with a second independent layer were not exposed by this failure. Design so that no single implementation is a single point of total failure.<\u002Fp><\u002Fdiv><\u002Fli>\n<\u002Fol>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">7<\u002Fspan>A defensive checklist for RNG / entropy code<\u002Fh3>\n<p style=\"font-size:13px;font-style:italic;color:var(--color-neutral-700)\">Use this as a review gate for anything that generates keys, seeds, nonces, or salts.<\u002Fp>\n<div style=\"display:grid;gap:var(--space-2);margin-top:var(--space-3)\">\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">Does a <strong>single, explicit<\u002Fstrong> function own \"get cryptographic randomness,\" and is every key/seed/nonce sourced through it? (No parallel <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">ngu.random<\u002Fcode> vs <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">ckcc.rng_bytes<\u002Fcode> ambiguity.)<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">Is the entropy <strong>source<\u002Fstrong> asserted at runtime (e.g., \"TRNG present and healthy\") and does the device <strong>halt<\u002Fstrong> if not? Fail closed.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">Are all feature guards written as <strong>value<\u002Fstrong> tests (<code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#if X<\u002Fcode>, <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">if config['x'] is True<\u002Fcode>), never existence tests?<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">Does the reseed/entropy API take a <strong>byte buffer + length<\u002Fstrong>, reject short inputs, and never silently truncate?<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">Is there a <strong>boot-time self-test that reads the actual production entropy path<\u002Fstrong> (not a separate code path) and checks it against the hardware source?<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">Is there an <strong>end-to-end statistical + provenance test on the built binary<\u002Fstrong>, run in CI, that would fail if the seed path stopped reaching the TRNG?<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">For every input to key material, is there a written <strong>bit-of-unpredictability budget<\u002Fstrong> that sums to ≥ the target (e.g., 128)?<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">Do you assume the source is <strong>public and machine-read by adversaries<\u002Fstrong>?<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:20px 1fr;gap:var(--space-3);align-items:start;font-size:14px;break-inside:avoid\"><div style=\"width:13px;height:13px;border:1px solid var(--color-accent);border-radius:1px;margin-top:5px\"><\u002Fdiv><div style=\"text-align:justify;hyphens:auto\">Is there an <strong>independent second factor<\u002Fstrong> (user entropy, passphrase, multi-vendor multisig) so one broken layer is survivable?<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">8<\u002Fspan>The test that would have caught it<\u002Fh3>\n<p style=\"text-align:justify;hyphens:auto\">You cannot detect predictability by staring at 32 output bytes. But you <em>can<\u002Fem> pin the production path to the intended source and assert the source is live. Two complementary tests, run against the real firmware build:<\u002Fp>\n<figure style=\"margin:0 0 var(--space-3);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-accent-100);border:1px solid var(--color-accent-300);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">def test_seed_path_uses_hw_trng(fw):\n    trace = fw.instrument_call_graph(entrypoint=\"new_wallet.generate_seed\")\n    entropy_calls = trace.leaf_calls(kind=\"entropy\")\n    assert entropy_calls, \"seed path made no entropy call at all\"\n    for c in entropy_calls:\n        # The ONLY acceptable source is the board TRNG wrapper.\n        assert c.symbol == \"ckcc.rng_bytes / board.random_buffer\", \\\n            f\"seed entropy came from {c.symbol}, not the hardware TRNG\"<\u002Fpre>\n<figcaption><strong>Illustrative, test 1<\u002Fstrong> — pin the seed path to the hardware TRNG symbol. Fails if the production wallet-generation path ever binds to a software fallback.<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-accent-100);border:1px solid var(--color-accent-300);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">def test_trng_failure_halts(dev):\n    dev.fault_injection(peripheral=\"STM32_RNG\", mode=\"timeout\")\n    result = dev.try_generate_seed()\n    assert result.halted, \"device continued after TRNG fault (fail-open!)\"\n    assert not result.produced_seed, \"a seed was produced without a live TRNG\"<\u002Fpre>\n<figcaption><strong>Illustrative, test 2<\u002Fstrong> — source liveness, not output shape. Force the TRNG peripheral to a known-fault state; the device must HALT, never silently fall back to software.<\u002Ffigcaption>\n<\u002Ffigure>\n<p style=\"text-align:justify;hyphens:auto\">Neither test inspects randomness quality. Both answer the question that actually failed for five years: <strong>\"is the real hardware source the thing our seed came from, and does the device refuse to proceed when it isn't?\"<\u002Fstrong><\u002Fp>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">9<\u002Fspan>Closing<\u002Fh3>\n<p style=\"text-align:justify;hyphens:auto\">The Coldcard <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> failure is worth teaching precisely because it contains no villains and no genius attack. A good team adopted a better crypto library, wrote a fail-safe guard, added secure-element reseeding, and shipped health checks — and still generated predictable keys for five years, because a <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">#ifndef<\u002Fcode> read a <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">0<\u002Fcode> as \"yes,\" a symbol resolved across a seam, and every safety net tested the wrong property.<\u002Fp>\n<blockquote style=\"margin:var(--space-6) 0;padding:var(--space-4) 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);break-inside:avoid\"><p style=\"font-family:var(--font-heading);font-size:27px;line-height:1.28;font-weight:400;margin:0;max-width:6.6in\">In modern cryptographic systems, the primitive is almost never the weak point. The seam is. Review the seams. Assert the source. Fail closed. Test the artifact. And give your users a second, independent secret so that when one layer fails — and one day a layer will — they are not wiped out by it.<\u002Fp><\u002Fblockquote>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Confidence notes for this lecture<\u002Fh4>\n<ul style=\"padding-left:1.2em;line-height:1.65;font-size:14px\">\n<li style=\"margin-bottom:var(--space-1)\">Mechanism and all Exhibit code: <strong>Confirmed<\u002Fstrong> (Block engineering report; Coinkite technical backgrounder).<\u002Fli>\n<li style=\"margin-bottom:var(--space-1)\">Effective-entropy magnitude (≈40 / ≈72 bits vs. ≤2³² / deterministic): <strong>Disputed<\u002Fstrong> between Coinkite and Block; treated as an open question in §4.5.<\u002Fli>\n<li style=\"margin-bottom:var(--space-1)\">Attacker's discovery method (AI-assisted / reverse-engineering): <strong>Speculative<\u002Fstrong>; flagged in §5.<\u002Fli>\n<li>Hardened rewrites, checklist, and tests in §6–§8: <strong>illustrative teaching material<\u002Fstrong>, not source code from either vendor.<\u002Fli>\n<\u002Ful>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Sources<\u002Fh4>\n<ol style=\"padding-left:1.4em;font-size:13px;line-height:1.6\">\n<li style=\"margin-bottom:var(--space-2)\">Block Bitcoin Engineering &amp; Security — <em>Predictable RNG Fallback and 32-Bit Reseed in COLDCARD Firmware<\u002Fem>. <a href=\"https://engineering.block.xyz/blog/predictable-rng-fallback-and-32-bit-reseed-in-coldcard-firmware\" style=\"word-break:break-all\">engineering.block.xyz<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">Coinkite — <em>Technical Deep Dive into the Entropy Issue<\u002Fem>. <a href=\"https://blog.coinkite.com/entropy-technical-backgrounder/\" style=\"word-break:break-all\">blog.coinkite.com/entropy-technical-backgrounder<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">Coinkite — <em>Coldcard Security Advisory<\u002Fem>. <a href=\"https://blog.coinkite.com/coldcard-mk3-seed-generation-warning/\" style=\"word-break:break-all\">blog.coinkite.com/coldcard-mk3-seed-generation-warning<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">Rodolfo Novak (NVK) — public statement. <a href=\"https://x.com/nvk/status/2083216713693151552\" style=\"word-break:break-all\">x.com/nvk<\u002Fa><\u002Fli>\n<li>Wizardsardine — <em>Critical Coldcard flaw<\u002Fem> (independent walkthrough of the same code path). <a href=\"https://wizardsardine.com/blog/coldcard-rng-vulnerability/\" style=\"word-break:break-all\">wizardsardine.com<\u002Fa><\u002Fli>\n<\u002Fol>\n\n<p style=\"font-size:12px;font-style:italic;color:var(--color-neutral-600);border-top:1px solid var(--color-divider);padding-top:var(--space-3);margin-top:var(--space-6)\">Part A and Part B, Coldcard <code style=\"font-family:ui-monospace,Menlo,monospace\">libngu<\u002Fcode> weak-entropy exploitation campaign. Authored by Douglas Mun, with AI assistance. TLP:CLEAR — public, unrestricted distribution.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"

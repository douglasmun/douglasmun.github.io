document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidde 2Fstyle>\n<\u002Fhelmet>\n\n\n\n<doc-page margin=\"0.8in\">\n\n<div slot=\"footer\" style=\"display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);padding-top:var(--space-2);border-top:1px solid var(--color-divider);font-family:var(--font-heading);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 50%, transparent)\">\n<span>CTI-2026-COLDCARD-RNG-001<\u002Fspan>\n<span>Coldcard <code style=\"font-family:inherit;letter-spacing:0.08em\">libngu<\u002Fcode> weak-entropy campaign<\u002Fspan>\n<span>TLP:CLEAR<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"min-height:8.1in;display:flex;flex-direction:column\">\n<div style=\"display:flex;align-items:baseline;gap:var(--space-3);font-family:var(--font-heading);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700)\">\n<span>Cyber Threat Intelligence<\u002Fspan>\n<span style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fspan>\n<span style=\"font-variant-numeric:tabular-nums\">2026-08-02<\u002Fspan>\n<\u002Fdiv>\n\n<h1 style=\"font-size:64px;font-weight:400;line-height:1.02;letter-spacing:-0.02em;margin:var(--space-8) 0 var(--space-4);max-width:9in;text-wrap:balance\">When the Fallback <span style=\"font-style:italic\">Was<\u002Fspan> the Bug<\u002Fh1>\n\n<p style=\"font-family:var(--font-heading);font-size:26px;line-height:1.25;margin:0 0 var(--space-6);max-width:6.4in;color:var(--color-neutral-800)\">The Coldcard (Coinkite) <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.82em\">libngu<\u002Fcode> weak-entropy exploitation campaign — incident report and root-cause dissection.<\u002Fp>\n\n<hr class=\"hr\" style=\"margin:0 0 var(--space-6)\">\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);max-width:6.6in\">\n<div>\n<div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:var(--space-1)\">Part A<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:21px;line-height:1.2;margin-bottom:var(--space-1)\">Cyber Threat Intelligence Report<\u002Fdiv>\n<p style=\"font-size:13px;margin:0;color:var(--color-neutral-700)\">Who, what, when, where — timeline, kill chain, exploitation methodology, impact and mitigations.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:var(--space-1)\">Part B<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:21px;line-height:1.2;margin-bottom:var(--space-1)\">Secure Coding Lecture<\u002Fdiv>\n<p style=\"font-size:13px;margin:0;color:var(--color-neutral-700)\">The developer-facing autopsy: code exhibits, bug-class taxonomy, checklist and lessons learned.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1;min-height:var(--space-8)\"><\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:auto 1fr;gap:var(--space-2) var(--space-6);font-size:13px;max-width:6.4in;border-top:1px solid var(--color-divider);padding-top:var(--space-4)\">\n<div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);padding-top:3px\">Report ID<\u002Fdiv>\n<div style=\"font-variant-numeric:tabular-nums\">CTI-2026-COLDCARD-RNG-001<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);padding-top:3px\">Author<\u002Fdiv>\n<div>Douglas Mun, with AI assistance<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);padding-top:3px\">Handling<\u002Fdiv>\n<div><span class=\"tag tag-outline\" style=\"font-size:10px;padding:1px 7px;margin-right:8px\">TLP:CLEAR<\u002Fspan>Public, unrestricted distribution. May be shared freely, without restriction. Derived entirely from public reporting.<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);padding-top:3px\">Prepared for<\u002Fdiv>\n<div>Self-custody holders, wallet/custody engineering teams, IR &amp; threat-intel teams<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);padding-top:3px\">Confidence<\u002Fdiv>\n<div>Moderate-to-High on mechanism and remediation; Low on attribution and final scope<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-before:page\">\n<h2 style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 var(--space-4)\">Contents<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8);font-size:14px\">\n<div>\n<div style=\"font-family:var(--font-heading);font-size:19px;border-bottom:1px solid var(--color-divider);padding-bottom:var(--space-2);margin-bottom:var(--space-2)\">Part A — CTI Report<\u002Fdiv>\n<ol style=\"margin:0;padding-left:1.6em;font-variant-numeric:tabular-nums;line-height:1.85\">\n<li>Disclaimer<\u002Fli>\n<li>Confidence &amp; Source Legend<\u002Fli>\n<li>Executive Summary<\u002Fli>\n<li>Bottom Line Up Front (BLUF)<\u002Fli>\n<li>The 5 Ws and H<\u002Fli>\n<li>Detailed Timeline<\u002Fli>\n<li>Detailed Sequence of Events<\u002Fli>\n<li><strong>Exploitation Methodology<\u002Fstrong><\u002Fli>\n<li>Impact Assessment<\u002Fli>\n<li>Recommendations &amp; Mitigations<\u002Fli>\n<li>Indicators &amp; Hunting Notes<\u002Fli>\n<li>Attribution &amp; Intelligence Gaps<\u002Fli>\n<li>Sources<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:var(--font-heading);font-size:19px;border-bottom:1px solid var(--color-divider);padding-bottom:var(--space-2);margin-bottom:var(--space-2)\">Part B — Secure Coding Lecture<\u002Fdiv>\n<ol start=\"0\" style=\"margin:0;padding-left:1.6em;font-variant-numeric:tabular-nums;line-height:1.85\">\n<li>How to read this<\u002Fli>\n<li>The cast of characters<\u002Fli>\n<li>What <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> is, and why it existed<\u002Fli>\n<li>The intended design<\u002Fli>\n<li><strong>Anatomy of the failure<\u002Fstrong><\u002Fli>\n<li>The meta-failure: five years of review<\u002Fli>\n<li>Lessons, generalized<\u002Fli>\n<li>A defensive checklist for RNG code<\u002Fli>\n<li>The test that would have caught it<\u002Fli>\n<li>Closing<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-before:page\">\n<div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700)\">Part A<\u002Fdiv>\n<h1 style=\"font-size:44px;font-weight:400;line-height:1.05;margin:var(--space-2) 0 var(--space-3);max-width:8in\">Cyber Threat Intelligence Report<\u002Fh1>\n<p style=\"font-family:var(--font-heading);font-size:19px;color:var(--color-neutral-700);margin:0 0 var(--space-4);max-width:6in\">Coldcard (Coinkite) <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> weak-entropy exploitation campaign.<\u002Fp>\n<hr class=\"hr\">\n\n<h3 style=\"font-size:22px;margin:var(--space-6) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">1<\u002Fspan>Disclaimer<\u002Fh3>\n<p style=\"text-align:justify;hyphens:auto\">This report is compiled <strong>exclusively from open-source reporting and vendor publications<\u002Fstrong> available as of 2026-08-02. It is provided for <strong>defensive and educational purposes only<\u002Fstrong>. Loss figures, address counts, and attribution are <strong>provisional<\u002Fstrong> and have been revised multiple times within a 72-hour window; they will likely change again. Nothing herein is legal, financial, or investment advice. On-chain data is discussed only for defensive understanding; <strong>do not use any information in this report to target, enumerate, or interact with third-party addresses<\u002Fstrong> — doing so may be unlawful. The exploitation methodology in Section 8 is reconstructed from vendor and blockchain-analytics analysis and is deliberately <strong>non-operational<\u002Fstrong>: it explains <em>how the class of attack works<\u002Fem> for defensive purposes and omits the parameters needed to reproduce it. The authors make no warranty of completeness or accuracy and assume no liability for actions taken on the basis of this report.<\u002Fp>\n\n<h3 style=\"font-size:22px;margin:var(--space-6) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">2<\u002Fspan>Confidence &amp; Source Legend<\u002Fh3>\n<sc-raw-table class=\"table\" style=\"break-inside:avoid\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:70px\">Tag<\u002Fsc-raw-th><sc-raw-th style=\"width:150px\">Level<\u002Fsc-raw-th><sc-raw-th>Basis<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><span class=\"tag tag-outline\" style=\"font-size:10px;padding:0 6px\">C<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Confirmed<\u002Fsc-raw-td><sc-raw-td>Stated in a primary source (Block engineering report, Coinkite advisory/backgrounder, or NVK statement); uncontradicted<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><span class=\"tag tag-outline\" style=\"font-size:10px;padding:0 6px\">H<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Multiple independent reputable outlets agree, or one primary source states it plainly with nothing against it<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><span class=\"tag tag-outline\" style=\"font-size:10px;padding:0 6px\">M<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Single-source, provisional, or actively being revised (e.g., running loss totals)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><span class=\"tag tag-outline\" style=\"font-size:10px;padding:0 6px\">L<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Low / Speculative<\u002Fsc-raw-td><sc-raw-td>Suspected, inferred, or explicitly hedged by the sources themselves<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><span class=\"tag tag-outline\" style=\"font-size:10px;padding:0 6px\">D<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Disputed<\u002Fsc-raw-td><sc-raw-td>Primary sources actively disagree<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n\n<h3 style=\"font-size:22px;margin:var(--space-6) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">3<\u002Fspan>Executive Summary<\u002Fh3>\n<p style=\"text-align:justify;hyphens:auto;font-size:16px\">A latent cryptographic <strong>key-generation defect<\u002Fstrong> in Coldcard (Coinkite) Bitcoin hardware-wallet firmware, present since <strong>March 2021<\u002Fstrong>, caused affected devices to generate wallet seeds using a <strong>deterministic software PRNG<\u002Fstrong> (MicroPython's \"Yasmarang\") instead of the intended STM32 <strong>true hardware RNG (TRNG)<\u002Fstrong>. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan> The seeds' effective entropy fell far below the 128-bit standard — low enough that an attacker could <strong>reconstruct private keys entirely offline<\u002Fstrong> and validate candidates against the public Bitcoin blockchain, <strong>without any access to the victim's device<\u002Fstrong>. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fp>\n<p style=\"text-align:justify;hyphens:auto;font-size:16px\">Beginning <strong>2026-07-30<\u002Fstrong>, an unidentified actor (or actors) exploited this in a series of rapid, automated sweeps. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan> As of 2026-08-02, Galaxy Research assessed cumulative losses at approximately <strong>1,367 BTC (~$88.6M) across 4,585 addresses in three waves<\u002Fstrong>, with all attacker-controlled funds reportedly <strong>unspent<\u002Fstrong>. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">M<\u002Fspan> Coinkite has released fixed firmware for all affected models, but a firmware update <strong>does not repair an already-generated seed<\u002Fstrong> — affected users must migrate. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan> This was <strong>not<\u002Fstrong> a break of Bitcoin's cryptography nor a compromise of the device air gap; it was a failure of the secret the air gap was protecting. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan> Notably, <strong>no public report has yet reconstructed a specific victim's seed and matched it to a drained address<\u002Fstrong> — the end-to-end attack is inferred with high confidence from on-chain patterns and vendor analysis, not publicly demonstrated. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);margin:var(--space-6) 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:var(--space-4) 0;break-inside:avoid\">\n<div><div style=\"font-family:var(--font-heading);font-size:34px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums\">1,367<\u002Fdiv><div style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:6px\">BTC swept<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-family:var(--font-heading);font-size:34px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums\">$88.6M<\u002Fdiv><div style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:6px\">Assessed loss<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-family:var(--font-heading);font-size:34px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums\">4,585<\u002Fdiv><div style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:6px\">Addresses drained<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-family:var(--font-heading);font-size:34px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums\">5 yrs<\u002Fdiv><div style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:6px\">Latent in public source<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-6) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">4<\u002Fspan>Bottom Line Up Front<\u002Fh3>\n<ul style=\"margin:0;padding-left:1.2em;line-height:1.7\">\n<li style=\"margin-bottom:var(--space-2)\"><strong>What:<\u002Fstrong> Mass theft of Bitcoin via offline reconstruction of predictable wallet seeds generated by defective Coldcard firmware. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Root cause:<\u002Fstrong> An RNG <strong>integration error<\u002Fstrong> in Coinkite's <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> library silently routed seed generation to a software fallback PRNG seeded from <strong>non-secret device data<\u002Fstrong> (chip UID + timer registers). <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>How exploited (Section 8):<\u002Fstrong> model the tiny generator state → generate candidate seeds → derive addresses across all standard paths/formats → intersect with funded addresses on the public chain (a free validation oracle) → sign and broadcast full-balance sweeps → consolidate and hold. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan> <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Exposure window (by seed-generation firmware):<\u002Fstrong> Mk2/Mk3 v4.0.1–v4.1.9 (Block: from v4.0.0); Mk4/Mk5 &lt; v5.6.0 (Edge &lt; 6.6.0X); Q &lt; v1.5.0Q (Edge &lt; 6.6.0QX). <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan> / v4.0.0-vs-v4.0.1 start <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">D<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Who is safe from this bug alone:<\u002Fstrong> seeds made with ≥50 fair/independent/private dice rolls; wallets behind a strong, unique BIP-39 passphrase (reduces, does not repair — still migrate); pre-v4.0.0 seeds; multisig with ≥1 non-vulnerable signer. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Immediate action:<\u002Fstrong> Update firmware → generate a <strong>new<\u002Fstrong> seed → test-transaction → migrate funds → retain old backup until confirmed. Do <strong>not<\u002Fstrong> rush. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<li><strong>Attribution:<\u002Fstrong> Unknown. One operator assessed <em>per wave<\u002Fem>; same actor across all three waves <strong>not confirmed<\u002Fstrong>. Actor left forensic traces at a commercial blockchain-data provider. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">L<\u002Fspan> <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<\u002Ful>\n\n<h3 style=\"font-size:22px;margin:var(--space-6) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">5<\u002Fspan>The 5 Ws and H<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:auto 1fr;gap:var(--space-3) var(--space-4);font-size:14px;line-height:1.6\">\n<div style=\"font-family:var(--font-heading);font-size:15px;letter-spacing:0.1em;color:var(--color-accent-700);padding-top:2px\">WHO<\u002Fdiv>\n<div style=\"text-align:justify;hyphens:auto\">Unidentified actor(s). Galaxy assesses each wave as a single operator but <strong>cannot confirm the same actor across all three<\u002Fstrong>; wave 3's harder-to-trace pattern is consistent with either evasion or a <strong>copycat<\u002Fstrong>. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">L<\u002Fspan> Victims: predominantly long-term, technically sophisticated single-sig self-custody holders. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">M<\u002Fspan> Discoverers: Block (root cause), Galaxy (on-chain scope), Coinkite (vendor). <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:15px;letter-spacing:0.1em;color:var(--color-accent-700);padding-top:2px\">WHAT<\u002Fdiv>\n<div style=\"text-align:justify;hyphens:auto\">Theft by reconstructing wallet seeds constrained to a searchable space, then sweeping derived addresses. Not a break of SHA-256/secp256k1/BIP-32/BIP-39; not an air-gap bypass. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:15px;letter-spacing:0.1em;color:var(--color-accent-700);padding-top:2px\">WHEN<\u002Fdiv>\n<div style=\"text-align:justify;hyphens:auto\">Vuln introduced 2021-03 (shipped v4.0.0, 2021-03-17). <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan> Active exploitation from 2026-07-30 in ≥3 waves through 2026-08-01/02. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan> (Initial-sweep timestamp 07-30 vs 07-31 varies by outlet.) <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">D<\u002Fspan><\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:15px;letter-spacing:0.1em;color:var(--color-accent-700);padding-top:2px\">WHERE<\u002Fdiv>\n<div style=\"text-align:justify;hyphens:auto\">Attacker operations off-device/off-network; candidate validation against <strong>Bitcoin mainnet<\u002Fstrong>. Victim footprint global. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:15px;letter-spacing:0.1em;color:var(--color-accent-700);padding-top:2px\">WHY<\u002Fdiv>\n<div style=\"text-align:justify;hyphens:auto\">Financial. Reduced entropy turned \"unguessable\" keys into an <strong>enumerable set<\u002Fstrong>; the public chain provided instant candidate validation. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:15px;letter-spacing:0.1em;color:var(--color-accent-700);padding-top:2px\">HOW<\u002Fdiv>\n<div style=\"text-align:justify;hyphens:auto\">See Sections 7–8 (mechanism + exploitation pipeline); full defect analysis in <strong>Part B<\u002Fstrong>.<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2);break-before:page\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">6<\u002Fspan>Detailed Timeline<\u002Fh3>\n<p style=\"font-size:13px;font-style:italic;color:var(--color-neutral-700)\">Times UTC unless noted. Vulnerability-introduction dates from Block's engineering timeline; exploitation/response dates from vendor and analytics reporting.<\u002Fp>\n<sc-raw-table class=\"table\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th sty ing:0 4px\">L<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:140px 1fr;gap:var(--space-4);border-top:1px solid var(--color-divider);padding-top:var(--space-2);break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:15px;color:var(--color-accent-700)\">Phase 6 <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">M<\u002Fspan><div style=\"font-size:11px;color:var(--color-neutral-600);letter-spacing:0.04em;margin-top:2px\">ongoing<\u002Fdiv><\u002Fdiv><div style=\"font-size:14px\"><strong>Holding / dormancy.<\u002Fstrong> All attacker funds reported unspent — unusual at this scale.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:140px 1fr;gap:var(--space-4);border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:var(--space-2) 0;break-inside:avoid\"><div style=\"font-family:var(--font-heading);font-size:15px;color:var(--color-accent-700)\">Phase 7 <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><div style=\"font-size:11px;color:var(--color-neutral-600);letter-spacing:0.04em;margin-top:2px\">response<\u002Fdiv><\u002Fdiv><div style=\"font-size:14px\"><strong>Defender response.<\u002Fstrong> Advisory + emergency firmware; NVK accountability; Block/Galaxy tracking. Residual risk: un-migrated seeds remain permanently exploitable. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2);break-before:page\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">8<\u002Fspan>Exploitation Methodology<\u002Fh3>\n<p style=\"font-family:var(--font-heading);font-size:18px;color:var(--color-neutral-800);margin-top:0\">From RNG weakness to drained wallet.<\u002Fp>\n<p style=\"font-size:13px;font-style:italic;color:var(--color-neutral-700);text-align:justify;hyphens:auto\">This section answers the operational question: once the actor knew the RNG was weak, how did they convert that into stolen coins? It is reconstructed from Block's engineering analysis and Galaxy's on-chain mapping. <strong>Caveat <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fstrong> no public report has published a reconstructed victim seed matched to a drained address, so the chain below is a high-confidence inference from artefacts, not a demonstrated exploit. It is written to be understood, not reproduced.<\u002Fp>\n\n<div style=\"border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:var(--space-4) 0;margin:var(--space-4) 0;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);break-inside:avoid\">\n<div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.1em;color:var(--color-accent);margin-bottom:4px\">STEP 1 · OFFLINE<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:16px\">Model generator state<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.1em;color:var(--color-accent);margin-bottom:4px\">STEP 2 · OFFLINE<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:16px\">Generate candidate seeds<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.1em;color:var(--color-accent);margin-bottom:4px\">STEP 3 · OFFLINE<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:16px\">Fan-out to addresses<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.1em;color:var(--color-accent);margin-bottom:4px\">STEP 6 · ON-CHAIN<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:16px\">Consolidate &amp; hold<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.1em;color:var(--color-accent);margin-bottom:4px\">STEP 5 · ON-CHAIN<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:16px\">Sign &amp; broadcast sweeps<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.1em;color:var(--color-accent);margin-bottom:4px\">STEP 4 · THE ORACLE<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:16px\">Validate against public chain<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Step 1 — Model the generator state (offline)<\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">The attacker rebuilds the Yasmarang PRNG, whose entire starting state is a function of a handful of <strong>non-secret<\u002Fstrong> values plus how many RNG calls preceded the seed draw: <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">pad = UID_low32 XOR SysTick<\u002Fcode>, <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">n = RTC-&gt;TR<\u002Fcode>, <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">d = RTC-&gt;SSR<\u002Fcode>. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fp>\n<ul style=\"padding-left:1.2em;line-height:1.65\">\n<li style=\"margin-bottom:var(--space-2)\"><strong>Mk2/Mk3 (v4):<\u002Fstrong> no cryptographic entropy enters at all. If the UID, timer state, and call history are known or constrained, seed generation is <strong>fully deterministic (2⁰)<\u002Fstrong>. Realistic ceilings run from ~2¹⁶ (SysTick-only, with a static cold-boot RTC) up to ~2⁴⁰·⁷ (counting all timer states). <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Mk4/Q/Mk5:<\u002Fstrong> the secure-element reseed contributes only 32 bits, bounding the space to <strong>≤2³² (~4 billion)<\u002Fstrong> — a figure that is enormous to a human but trivially searchable by a computer. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<li><strong>State-narrowing trick:<\u002Fstrong> because these behaviours are common across units, an attacker can <strong>profile an attacker-owned device of the same model<\u002Fstrong> under controlled boots to learn the likely SysTick/RTC/call-history distributions, then <em>prioritise<\u002Fem> the most probable states first — cutting real-world work far below the theoretical ceiling. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<\u002Ful>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Step 2 — Generate candidate seeds (offline)<\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">For each candidate RNG stream, the attacker reproduces the 32 output bytes, applies the same <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">SHA256d<\u002Fcode> the firmware uses, and forms the candidate BIP-39 mnemonic → BIP-32 master key. The hashing and BIP-39 checksum add <strong>no<\u002Fstrong> entropy, so the candidate-seed count never exceeds the candidate-state count from Step 1. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fp>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Step 3 — Fan-out to addresses (offline)<\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">A single seed can produce many addresses, so each candidate seed is expanded across <strong>all standard derivation paths and script types<\u002Fstrong> — legacy P2PKH, P2SH-wrapped segwit, native segwit (bech32), and taproot — scanning a gap limit of receive/change addresses. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fp>\n<ul style=\"padding-left:1.2em;line-height:1.65\">\n<li style=\"margin-bottom:var(--space-2)\"><strong>Forensic proof this is how it was done:<\u002Fstrong> the drained wallets spanned <strong>1,183 native-segwit, 7 older-standard, and 6 oldest-format<\u002Fstrong> addresses. No one targets a <em>specific<\u002Fem> victim across three address formats simultaneously; that spread is the signature of <strong>systematic per-seed enumeration<\u002Fstrong>, testing every path a candidate seed might have produced. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<li><strong>Wave-to-wave difference:<\u002Fstrong> wave 1 processed one victim at a time; the <strong>third wave<\u002Fstrong> traded depth for speed — batching an average of ~6 victims per sweep and scanning <strong>only the default derivation path<\u002Fstrong>. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">M<\u002Fspan><\u002Fli>\n<\u002Ful>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Step 4 — Validate against the public chain (the oracle)<\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">The derived candidate addresses are intersected with the set of <strong>funded addresses / UTXOs visible on Bitcoin mainnet<\u002Fstrong> (obtainable from the public chainstate or an address index). A match confirms a recovered private key. Every step so far runs on attacker hardware; <strong>the victim's device is never contacted and can be powered off in a safe on another continent.<\u002Fstrong> <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fp>\n<div style=\"border-left:2px solid var(--color-accent);padding:var(--space-2) 0 var(--space-2) var(--space-4);margin:var(--space-3) 0;font-size:14px;text-align:justify;hyphens:auto;break-inside:avoid\"><strong>Operational shortcut → forensic trail.<\u002Fstrong> Rather than run their own full index, the operator used a <strong>paid account at a well-known blockchain-data provider<\u002Fstrong> to look up the source addresses during the sweeps. Block's Clay Garrett reported that the provider's internal logs lined up with the suspected sweep workflow in fine detail — matching the count, timing, and ordering of the queries. This is currently investigators' strongest attribution lead, and the campaign's clearest <em>operational mistake<\u002Fem>. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fdiv>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Step 5 — Sign &amp; broadcast sweeps (on-chain)<\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">For each recovered key, the attacker builds a transaction spending <strong>all<\u002Fstrong> of the wallet's UTXOs to attacker-controlled addresses — <strong>full drains with no change output<\u002Fstrong>, a hallmark of automated key-sweeping. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan> Broadcasts were <strong>batched<\u002Fstrong>: Galaxy's mapping of wave 1 (~1,082.65 BTC) ran between ~01:10 and 01:51 UTC across six blocks, with some intervening blocks empty — consistent with scripted batch submission rather than continuous streaming. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fp>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Step 6 — Consolidate &amp; hold (on-chain)<\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">The bulk of wave 1 (~562 BTC) was <strong>consolidated into a single address<\u002Fstrong> and, as of 2026-08-02, has not moved. Across all waves the funds remain <strong>unspent<\u002Fstrong> in a small number of addresses — unusual for a theft of this size, and read by analysts as the actor awaiting reduced scrutiny or lacking a low-visibility laundering path. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">M<\u002Fspan><\u002Fp>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Step 7 — Iterate indefinitely<\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">Because the entire pipeline is offline, the actor can <strong>pause, refine, and resume<\u002Fstrong> enumeration at will — expanding to additional seeds and progressively smaller balances (as seen in wave 3). Every un-migrated affected seed remains permanently enumerable, so opportunistic follow-on theft is expected now that the flaw is public. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fp>\n\n<h4 style=\"font-size:18px;margin:var(--space-6) 0 var(--space-2)\">Why the chain works — and what breaks it<\u002Fh4>\n<p style=\"text-align:justify;hyphens:auto\">The attack is possible only because three preconditions line up: <strong>(a)<\u002Fstrong> the candidate space is small (Step 1), <strong>(b)<\u002Fstrong> candidate seeds map deterministically to checkable public addresses (Steps 2–3), and <strong>(c)<\u002Fstrong> the blockchain answers \"is this address funded?\" for free (Step 4). Defences work by <strong>destroying precondition (a) or (b) with an independent secret the attacker cannot enumerate<\u002Fstrong>:<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin:var(--space-4) 0;break-inside:avoid\">\n<div class=\"card\"><div class=\"card-kicker\">Breaks step 1<\u002Fdiv><div class=\"card-title\">≥50 private dice rolls<\u002Fdiv><p class=\"card-body\">Injects user entropy hashed into the seed → the state model no longer determines the seed. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"card-kicker\">Breaks step 3<\u002Fdiv><div class=\"card-title\">Strong BIP-39 passphrase<\u002Fdiv><p class=\"card-body\">Creates a separate wallet the recovered seed words cannot reach without also guessing the passphrase. Reduces exposure but does not repair the seed — still migrate. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"card-kicker\">Breaks step 5<\u002Fdiv><div class=\"card-title\">Multisig, ≥1 clean signer<\u002Fdiv><p class=\"card-body\">Recovering one weak key is insufficient to spend. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">9<\u002Fspan>Impact Assessment<\u002Fh3>\n<ul style=\"padding-left:1.2em;line-height:1.65\">\n<li style=\"margin-bottom:var(--space-2)\"><strong>Direct financial:<\u002Fstrong> ~1,367 BTC (~$88.6M) and rising; concentrated among individual self-custody holders. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">M<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Residual/latent:<\u002Fstrong> every un-migrated affected seed remains exploitable <strong>indefinitely<\u002Fstrong>; total exposure exceeds observed losses. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Ecosystem/trust:<\u002Fstrong> major blow to self-custody confidence; renewed custodian/ETF-vs-self-custody debate and scrutiny of open-source assurance. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<li><strong>Cross-vendor:<\u002Fstrong> no evidence other vendors share this defect; Trezor publicly stated it does not share Coldcard's code and mixes multiple entropy sources. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<\u002Ful>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">10<\u002Fspan>Recommendations &amp; Mitigations<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:170px 1fr;gap:var(--space-3) var(--space-4);font-size:14px;line-height:1.6\">\n<div style=\"font-family:var(--font-heading);font-size:16px;color:var(--color-accent-700);border-top:1px solid var(--color-divider);padding-top:var(--space-2)\">Affected holders <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fdiv>\n<div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-2);text-align:justify;hyphens:auto\">Update firmware → generate a new seed → verify backup/fingerprint → small test tx → migrate remaining funds → keep old backup until confirmed. Passphrase wallets = \"reduced risk, still migrate.\" Seeds made with ≥50 private dice rolls are not assessed at risk from this bug alone.<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:16px;color:var(--color-accent-700);border-top:1px solid var(--color-divider);padding-top:var(--space-2)\">Custody &amp; wallet engineers<\u002Fdiv>\n<div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-2);text-align:justify;hyphens:auto\">Single-source, explicitly-injected entropy; assert TRNG liveness and <strong>fail closed<\u002Fstrong>; boot-time self-test of the <em>production<\u002Fem> seed path; treat crypto-plumbing refactors as high-risk reviews. → Part B.<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-size:16px;color:var(--color-accent-700);border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:var(--space-2) 0\">IR &amp; threat-intel<\u002Fdiv>\n<div style=\"border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:var(--space-2) 0;text-align:justify;hyphens:auto\">Advise any constituent with a Coldcard-generated seed (any model, any age) to migrate; assume public exploitation continues.<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">11<\u002Fspan>Indicators &amp; Hunting Notes<\u002Fh3>\n<ul style=\"padding-left:1.2em;line-height:1.65\">\n<li style=\"margin-bottom:var(--space-2)\"><strong>No conventional network IOCs<\u002Fstrong> (no C2/malware/device telemetry) — the attack is off-device. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>On-chain behavioural markers<\u002Fstrong> (investigative use only; <strong>do not act on third-party addresses<\u002Fstrong>): full-balance sweeps with <strong>no change output<\u002Fstrong>; wallets created after 2021-03-17; multi-format spread per seed; batched broadcasts across blocks; consolidation into a few <strong>unspent<\u002Fstrong> addresses. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\"><strong>Provider-side signal:<\u002Fstrong> anomalous <strong>bulk balance/lookup query patterns<\u002Fstrong> at commercial blockchain-data APIs preceding/accompanying sweeps — the vector that exposed this operator. Data providers should hunt for this pattern. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<li><strong>Highest-priority self-triage:<\u002Fstrong> <em>was the seed generated on affected firmware without dice/passphrase?<\u002Fem> → treat as compromised. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">C<\u002Fspan><\u002Fli>\n<\u002Ful>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">12<\u002Fspan>Attribution &amp; Intelligence Gaps<\u002Fh3>\n<ul style=\"padding-left:1.2em;line-height:1.65\">\n<li style=\"margin-bottom:var(--space-2)\"><strong>Attribution status:<\u002Fstrong> unknown actor(s); one operator <em>per wave<\u002Fem>; same actor across waves <strong>unconfirmed<\u002Fstrong>. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">L<\u002Fspan> Best current lead: commercial blockchain-data-provider logs tied to the sweep workflow. <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">H<\u002Fspan><\u002Fli>\n<li><strong>Gaps:<\u002Fstrong> discovery method (AI vs manual vs binary RE) <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">L<\u002Fspan>; true count of vulnerable seeds and total exposed value <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">M<\u002Fspan>; exact Mk4/Q/Mk5 effective entropy (Coinkite ~72 bits vs Block ≤2³²) <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">D<\u002Fspan>; whether/when dormant funds move <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">L<\u002Fspan>; whether waves share an operator <span class=\"tag tag-outline\" style=\"font-size:9px;padding:0 4px\">L<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">13<\u002Fspan>Sources<\u002Fh3>\n<ol style=\"padding-left:1.4em;font-size:13px;line-height:1.6\">\n<li style=\"margin-bottom:var(--space-2)\">Block Bitcoin Engineering &amp; Security — <em>Predictable RNG Fallback and 32-Bit Reseed in COLDCARD Firmware<\u002Fem>. <a href=\"https://engineering.block.xyz/blog/predictable-rng-fallback-and-32-bit-reseed-in-coldcard-firmware\" style=\"word-break:break-all\">engineering.block.xyz<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">Coinkite — <em>Coldcard Security Advisory<\u002Fem>. <a href=\"https://blog.coinkite.com/coldcard-mk3-seed-generation-warning/\" style=\"word-break:break-all\">blog.coinkite.com/coldcard-mk3-seed-generation-warning<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">Coinkite — <em>Technical Deep Dive into the Entropy Issue<\u002Fem>. <a href=\"https://blog.coinkite.com/entropy-technical-backgrounder/\" style=\"word-break:break-all\">blog.coinkite.com/entropy-technical-backgrounder<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">Rodolfo Novak (NVK) — public statement. <a href=\"https://x.com/nvk/status/2083216713693151552\" style=\"word-break:break-all\">x.com/nvk<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">CoinDesk — <em>How bitcoin cold wallets lost $70M in an attack that never touched the devices<\u002Fem> (enumeration, address-format spread, provider-log trail). <a href=\"https://www.coindesk.com/tech/2026/08/01/how-bitcoin-cold-wallets-lost-usd70-million-in-an-attack-that-never-touched-the-devices\" style=\"word-break:break-all\">coindesk.com<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">CoinDesk — <em>Attack spreads to 4,500 addresses<\u002Fem>; wave-3 batching/derivation-path detail. <a href=\"https://www.coindesk.com/tech/2026/08/02/bitcoin-cold-wallet-attack-spreads-to-4-500-addresses-as-losses-near-usd89-million\" style=\"word-break:break-all\">coindesk.com<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">CoinDesk — <em>Major bitcoin wallet flaw drains 594 BTC in 25-minute sweep<\u002Fem>. <a href=\"https://www.coindesk.com/tech/2026/07/31/major-bitcoin-wallet-flaw-drains-594-btc-in-25-minute-sweep\" style=\"word-break:break-all\">coindesk.com<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">Crypto Times — Galaxy / three-wave scope. <a href=\"https://www.cryptotimes.io/2026/08/02/coldcard-hack-tops-88-6m-as-galaxy-finds-third-attack-wave/\" style=\"word-break:break-all\">cryptotimes.io<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">The Hacker News — flaw linked to $70M theft; \"no public report has reconstructed a victim seed\". <a href=\"https://thehackernews.com/2026/08/coldcard-hardware-wallet-flaw-linked-to.html\" style=\"word-break:break-all\">thehackernews.com<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">BitKE — case-study breakdown of the enumeration process. <a href=\"https://bitcoinke.io/2026/08/the-coldcard-bitcoin-exploit-case-study/\" style=\"word-break:break-all\">bitcoinke.io<\u002Fa><\u002Fli>\n<li style=\"margin-bottom:var(--space-2)\">news.bitcoin.com — automated prepared-key-list pattern; Trezor statement; Lopp on 120-day record purge. <a href=\"https://news.bitcoin.com/featured/the-coldcard-exploit-explained-who-lost-bitcoin-and-whos-at-risk/\" style=\"word-break:break-all\">news.bitcoin.com<\u002Fa><\u002Fli>\n<li>Bitcoin Magazine — fixed firmware; AI angle; Peter Todd guidance. <a href=\"https://bitcoinmagazine.com/business/coinkite-releases-fixed-firmware-after-coldcard-bug-ai-likely-involved-in-the-hack\" style=\"word-break:break-all\">bitcoinmagazine.com<\u002Fa><\u002Fli>\n<\u002Fol>\n\n<p style=\"font-size:12px;font-style:italic;color:var(--color-neutral-600);border-top:1px solid var(--color-divider);padding-top:var(--space-3);margin-top:var(--space-4)\">Prepared 2026-08-02. TLP:CLEAR. Confidence tags reflect public-evidence strength at time of writing; Medium, Low and Disputed items are expected to change.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"break-before:page\">\n<div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700)\">Part B<\u002Fdiv>\n<h1 style=\"font-size:44px;font-weight:400;line-height:1.05;margin:var(--space-2) 0 var(--space-3);max-width:8in\">Secure Coding Lecture<\u002Fh1>\n<p style=\"font-family:var(--font-heading);font-size:19px;color:var(--color-neutral-700);margin:0 0 var(--space-3);max-width:6.4in\">When the fallback <em>was<\u002Fem> the bug — full technical depth and lessons learned, taught from the Coldcard <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> entropy failure, March 2021 – July 2026.<\u002Fp>\n<p style=\"font-size:13px;font-style:italic;color:var(--color-neutral-700);max-width:6.4in\">Companion to Part A. Part A covers the who/what/when/where of the campaign; Part B is the developer-facing root-cause dissection and secure-coding curriculum.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"border-left:2px solid var(--color-accent);padding:var(--space-2) 0 var(--space-2) var(--space-4);margin:var(--space-4) 0;font-size:13.5px;text-align:justify;hyphens:auto\"><strong>Provenance &amp; confidence.<\u002Fstrong> The mechanism and every \"exhibit\" code block below are drawn from two primary sources — Block's engineering root-cause report and Coinkite's own technical backgrounder — and are <strong>Confirmed<\u002Fstrong>. Where a <em>hardened<\u002Fem> rewrite or test appears, it is <strong>illustrative<\u002Fstrong> and labelled as such. Two things remain contested or unproven and are flagged in place: the exact effective-entropy numbers (Coinkite and Block disagree), and how the attacker discovered the flaw (speculative). This document is a teaching companion to the incident report; it is not Coinkite's or Block's official write-up.<\u002Fdiv>\n\n<h3 style=\"font-size:22px;margin:var(--space-6) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">0<\u002Fspan>How to read this<\u002Fh3>\n<p style=\"text-align:justify;hyphens:auto\">We are going to perform an autopsy. The patient is a single seed-generation call inside a Bitcoin hardware wallet. The cause of death is not exotic cryptanalysis — it is a <strong>build-configuration macro, a preprocessor guard, and a symbol-resolution accident<\u002Fstrong>, stacked on top of each other so that a device advertising a true hardware random number generator silently shipped a deterministic one for five years.<\u002Fp>\n<p style=\"text-align:justify;hyphens:auto\">The value of the case is that it is <em>boring<\u002Fem>. Nothing here requires a cryptography PhD. Every mistake is one that a competent engineer can make, and every mistake had a \"safety net\" that should have caught it and didn't. We will name each net and explain why it tore.<\u002Fp>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">1<\u002Fspan>The cast of characters<\u002Fh3>\n<p>To read the failure you need to know the five moving parts and how they were <em>supposed<\u002Fem> to relate.<\u002Fp>\n<sc-raw-table class=\"table\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:150px\">Component<\u002Fsc-raw-th><sc-raw-th>What it is<\u002Fsc-raw-th><sc-raw-th style=\"width:32%\">Role in seed generation<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><strong>STM32 TRNG<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A true hardware random-number peripheral inside the microcontroller<\u002Fsc-raw-td><sc-raw-td>The intended, real source of entropy<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong><code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">ckcc<\u002Fcode> board layer<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Coldcard's own C code for the board. Exposes <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">random_buffer()<\u002Fcode> / <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">random32()<\u002Fcode>, surfaced to Python as <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">ckcc.rng_bytes<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>The <em>correct<\u002Fem> wrapper that reads the STM32 TRNG and fails on timeout/repeat<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>MicroPython<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The embedded Python runtime the firmware runs on. Ships its <em>own<\u002Fem> RNG with a hardware path and a <strong>software fallback<\u002Fstrong> (a small PRNG called <em>Yasmarang<\u002Fem>)<\u002Fsc-raw-td><sc-raw-td>Should have been irrelevant to seed generation; became the actual source<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong><code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode><\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Coinkite's C extension library (\"the <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">ngu<\u002Fcode> module\"), added in 2021 to expose Bitcoin Core's <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libsecp256k1<\u002Fcode> and other primitives<\u002Fsc-raw-td><sc-raw-td>The library the seed path was <em>migrated onto<\u002Fem> — and where the wiring went wrong<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong><code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">MICROPY_HW_ENABLE_RNG<\u002Fcode><\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A build-time C macro that tells MicroPython whether to compile its hardware RNG path<\u002Fsc-raw-td><sc-raw-td>Set to <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">0<\u002Fcode> on purpose; misread by <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<p style=\"margin-top:var(--space-4)\">Keep one distinction in your head for the whole lecture:<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin:var(--space-3) 0;break-inside:avoid\">\n<div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)\"><div style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-bottom:4px\">ckcc.rng_bytes<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-700)\">→ the real STM32 hardware TRNG. <strong style=\"color:var(--color-accent-700)\">Correct.<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)\"><div style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-bottom:4px\">ngu.random.bytes<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-700)\">→ (as shipped) MicroPython's deterministic Yasmarang fallback. <strong style=\"color:var(--color-accent-700)\">Broken.<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"text-align:justify;hyphens:auto\">The entire disaster is that seed generation moved from the first to the second, and nobody noticed the arrow had been redrawn.<\u002Fp>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">2<\u002Fspan>What <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.8em\">libngu<\u002Fcode> is, and why it existed<\u002Fh3>\n<p style=\"text-align:justify;hyphens:auto\">In 2021 Coinkite made a defensible, even admirable, engineering decision: stop maintaining a bespoke elliptic-curve stack and adopt <strong>Bitcoin Core's <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libsecp256k1<\u002Fcode><\u002Fstrong>, the same battle-tested implementation Core itself uses. To expose that C library (and related primitives — hashing, key derivation, random bytes) to the MicroPython firmware, they wrote an embedded binding layer. That layer is <strong><code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode><\u002Fstrong>, imported in Python as <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">ngu<\u002Fcode>. It lives in the firmware tree under <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">external/libngu/<\u002Fcode> (you will see paths like <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">external/libngu/ngu/k1.c<\u002Fcode> for the secp256k1 code).<\u002Fp>\n<p style=\"text-align:justify;hyphens:auto\">So <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> is a <strong>glue library<\u002Fstrong>: a thin C shim that makes high-assurance cryptographic primitives callable from Python.<\u002Fp>\n<blockquote style=\"margin:var(--space-4) 0;padding:0;border:0;break-inside:avoid\"><p style=\"font-family:var(--font-heading);font-size:26px;line-height:1.25;font-weight:400;margin:0 0 var(--space-2);max-width:6.4in\">\"The cryptographic choice was sound; the integration was not.\"<\u002Fp><div style=\"font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-600)\">Coinkite, postmortem<\u002Fdiv><\u002Fblockquote>\n<p style=\"text-align:justify;hyphens:auto\">That sentence is the whole lecture in miniature. <strong>The danger in modern systems is rarely the primitive. It is the seam between components.<\u002Fstrong> <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:0.85em\">libngu<\u002Fcode> needed its own way to get random bytes (for key generation, nonces, masks, etc.). It therefore declared an entropy entry point and expected the board to provide a real hardware TRNG behind it. Here is where the seam split open.<\u002Fp>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0 var(--space-2)\"><span style=\"color:var(--color-accent);font-variant-numeric:tabular-nums;margin-right:0.5em\">3<\u002Fspan>The intended design<\u002Fh3>\n<p>Before the migration, firmware v3.2.2 generated a wallet seed like this:<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">seed = bytearray(32)\nrng_bytes(seed)          # -&gt; ckcc.rng_bytes -&gt; board random_buffer() -&gt; STM32 TRNG<\u002Fpre>\n<figcaption><strong>Exhibit A<\u002Fstrong> — the correct pre-2021 path (firmware v3.2.2).<\u002Ffigcaption>\n<\u002Ffigure>\n<p style=\"text-align:justify;hyphens:auto\">That call reached the board-local hardware wrapper, which reads the STM32 TRNG and, importantly, <strong>fails on timeout or repeated samples<\u002Fstrong> — it is designed to fail <em>closed<\u002Fem>. Good. The board also deliberately turns off MicroPython's <em>own<\u002Fem> RNG, because Coldcard supplies its own:<\u002Fp>\n<figure style=\"margin:0 0 var(--space-4);break-inside:avoid\">\n<pre style=\"margin:0;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-x:auto\">// \"We have our own version of this code.\"\n#define MICROPY_HW_ENABLE_RNG (0)<\u002Fpre>\n<figcaption><strong>Exhibit B<\u002Fstrong> — board config header, <code style=\"font-family:ui-monospace,Menlo,monospace\">stm32/COLDCARD/mpconfigboard.h<\u002Fcode>.<\u002Ffigcaption>\n<\u002Ffigure>\n<p style=\"text-align:justify;hyphens:auto\">Read that macro the way a human reads it: <em>\"MicroPython's RNG is disabled; we use ours.\"<\u002Fem> Hold that reading. The machine did not agree.<\u002Fp>\n\n<h3 style=\"font-size:22px;margin:var(--space-8) 0
